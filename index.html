<script>
/* Apply a saved theme before first paint to avoid a flash. Only the theme choice is stored here. */
try{var t=localStorage.getItem("prepwise-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}
</script>

    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>

<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="topin">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 64 64"><path d="M14 24h36l-4 26H18z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/><path d="M23 24c0-6 4-10 9-10s9 4 9 10" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg></div>
      <div><h1>Prepwise</h1><small>Meal prep, planned</small></div>
    </div>
    <div class="tools">
      <button class="iconbtn" id="theme" type="button" aria-label="Switch to dark theme"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg></button>
      <button class="pill" id="acct" type="button">Sign in</button>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button type="button" data-tab="home" aria-current="page"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg>Home</button>
    <button type="button" data-tab="shop"><svg class="ic" aria-hidden="true"><use href="#i-cart"/></svg>Shop</button>
    <button type="button" data-tab="cooking"><svg class="ic" aria-hidden="true"><use href="#i-pot"/></svg>Cooking</button>
    <button type="button" data-tab="meals"><svg class="ic" aria-hidden="true"><use href="#i-plate"/></svg>Meals</button>
    <button type="button" data-tab="progress"><svg class="ic" aria-hidden="true"><use href="#i-trend"/></svg>Progress</button>
    <button type="button" data-tab="cook"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg>Cook day</button>
  </div>
</nav>

<main id="main" tabindex="-1"></main>

<dialog id="signin" aria-labelledby="si-h">
  <form id="si-form" method="dialog" style="display:flex;flex-direction:column;gap:14px">
    <h3 id="si-h">Sign in to sync</h3>
    <p class="muted small">Enter your email and we'll send you a sign-in link. Your list, meals and weights then sync across your phone and laptop.</p>
    <label class="f" for="si-email">Email<input type="email" id="si-email" required autocomplete="email" placeholder="you@example.com"></label>
    <p class="small" id="si-msg" role="status"></p>
    <div class="row"><button class="btn" id="si-send" type="submit">Send link</button><button class="btn ghost" id="si-close" type="button">Close</button></div>
  </form>
</dialog>

<div class="timers" aria-live="polite"><div class="in" id="timers"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script src="js/recs.js"></script>
<script src="js/app.js"></script>

</html>
